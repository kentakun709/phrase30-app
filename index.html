<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="日常会話の基本30フレーズを6言語で。タップで発音が聞ける（ベータ）">
<title>30フレーズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="title">30フレーズ <span class="beta">ベータ</span></h1>
  <nav id="tabs" class="tabs" aria-label="言語"></nav>
  <div id="notice" class="notice" role="status" hidden></div>
  <div id="voiceinfo" class="voiceinfo" aria-live="polite"></div>
</header>
<main>
  <ol id="list" class="list" aria-label="フレーズ一覧"></ol>
  <p id="loading" class="loading">読み込み中…</p>
</main>
<footer class="foot">
  <p>カードを押すと鳴ります。もう一度押すと、もう一度鳴ります。音声は端末の読み上げ機能（登録・課金なし）。</p>
</footer>
<script src="app.js"></script>
</body>
</html>
