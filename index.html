<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="日常会話の基本30フレーズを6言語で。タップで発音が聞ける（ベータ）">
<title>30フレーズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 class="title">30フレーズ <span class="beta">ベータ</span></h1>
  <nav id="tabs" class="tabs" role="tablist" aria-label="言語"></nav>
  <p class="hint">カードを押すと鳴ります。何度でも。聞こえない時は音量と消音スイッチを確かめてください。</p>
  <p id="langnote" class="langnote"></p>
  <div id="notice" class="notice" role="status" hidden><span class="ntext" id="noticetext"></span><button type="button" class="nclose" id="noticeclose" aria-label="閉じる">×</button></div>
  <div class="controls">
    <div id="voiceinfo" class="voiceinfo" aria-live="polite"></div>
    <button type="button" id="slow" class="toggle" aria-pressed="false">ゆっくり</button>
  </div>
</header>
<main>
  <ol id="list" class="list" aria-label="フレーズ一覧"></ol>
  <p id="loading" class="loading">読み込み中…</p>
</main>
<footer class="foot">
  <p>音声は端末の読み上げ機能（登録・課金なし）。声の有無と質は端末によって違い、6言語すべての音質は保証していません。もっと自然な声にしたい時は、iPhone: 設定 → アクセシビリティ → 読み上げコンテンツ → 声、Android: 設定 → テキスト読み上げ で高品質の声を追加できます。</p>
</footer>
<script src="app.js"></script>
</body>
</html>
