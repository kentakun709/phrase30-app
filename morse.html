<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0">
<title>MORSE TAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&family=Saira+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #0A0D13;
    --plate: #151B2B;
    --silk: #D8DDE5;
    --edge: #8E97A3;
    --led-on: #43E36F;
    --led-off: #25352C;
    --error: #FF5A5A;
    --panel: #111722;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 280px;
    min-height: 100vh;
    overflow-x: hidden;
    background: var(--ground);
    color: var(--silk);
    font-family: "Noto Sans JP", system-ui, sans-serif;
  }
  button, input, textarea { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--led-on);
    outline-offset: 3px;
  }
  .app {
    width: 100%;
    max-width: 520px;
    min-width: 0;
    margin: 0 auto;
    padding: 14px 12px 32px;
  }
  .app-header {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 16px;
    margin: 2px 4px 12px;
  }
  .app-header > *, .prompt-row > *, .quiz-row > * { min-width: 0; }
  h1 {
    margin: 0;
    font: 700 clamp(1.55rem, 7vw, 2.25rem)/1 "Saira Semi Condensed", sans-serif;
    letter-spacing: .12em;
  }
  .tagline { margin: 0; color: var(--edge); font-size: .7rem; letter-spacing: .08em; }
  .plate-wrap { position: relative; width: 100%; min-width: 0; }
  #plate { display: block; width: 100%; max-width: 100%; height: auto; max-height: 48vh; max-height: 48svh; margin: 0 auto; }
  .plate-edge { fill: var(--plate); stroke: var(--edge); stroke-width: 3; }
  .plate-inner { fill: none; stroke: #323b4d; stroke-width: 1; }
  .plate-title { fill: var(--silk); font: 600 25px "Saira Semi Condensed", sans-serif; letter-spacing: 5px; }
  .plate-subtitle { fill: var(--edge); font: 600 10px "IBM Plex Mono", monospace; letter-spacing: 4px; }
  .antenna, .branch { fill: none; stroke: var(--edge); stroke-width: 2; stroke-linecap: round; }
  .branch { opacity: .74; }
  .hanger-rim { fill: #080b11; stroke: var(--edge); stroke-width: 4; }
  .hanger-hole { fill: var(--ground); stroke: #4a5361; stroke-width: 2; }
  .morse-node { cursor: pointer; }
  .morse-node .lamp { fill: var(--led-off); stroke: #617068; stroke-width: 1.4; transition: fill .14s, stroke .14s; }
  .morse-node .node-label { fill: var(--silk); font: 600 18px "Saira Semi Condensed", sans-serif; pointer-events: none; }
  .morse-node:hover .lamp, .morse-node:focus .lamp { stroke: var(--silk); }
  .morse-node.active .lamp {
    fill: var(--led-on);
    stroke: #baffc6;
    stroke-width: 3;
  }
  .morse-node.error .lamp { fill: var(--error); stroke: #ffc0c0; stroke-width: 3; }
  .morse-node:focus-visible .lamp { stroke: var(--silk); stroke-width: 3; }
  .node-hit { fill: transparent; stroke: none; }
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 5px;
    margin-top: 14px;
    border: 1px solid #2a3342;
    border-radius: 14px;
    background: #0d121b;
  }
  .tab {
    min-width: 0;
    min-height: 45px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--edge);
    font-weight: 700;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: #233027; color: var(--led-on); }
  .panel {
    min-width: 0;
    margin-top: 10px;
    padding: 16px;
    min-height: 178px;
    border: 1px solid #293141;
    border-radius: 16px;
    background: var(--panel);
  }
  .panel[hidden] { display: none; }
  .eyebrow { margin: 0 0 5px; color: var(--edge); font-size: .72rem; letter-spacing: .1em; }
  .instruction { margin: 5px 0 0; color: #aeb6c1; font-size: .78rem; line-height: 1.65; }
  .readout {
    min-height: 52px;
    margin: 0;
    color: var(--led-on);
    font: 600 clamp(2rem, 10vw, 3.1rem)/1.15 "IBM Plex Mono", monospace;
    letter-spacing: .15em;
  }
  .readout .letter { color: var(--silk); font-family: "Saira Semi Condensed", sans-serif; }
  .prompt-row, .quiz-row, .stats { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .prompt-letter { color: var(--silk); font: 700 2.5rem/1 "Saira Semi Condensed", sans-serif; }
  .key {
    width: 100%;
    min-height: 78px;
    margin-top: 12px;
    border: 1px solid #647167;
    border-bottom-width: 5px;
    border-radius: 16px;
    background: #1c2820;
    color: var(--led-on);
    font-weight: 700;
    letter-spacing: .08em;
    touch-action: none;
    cursor: pointer;
    user-select: none;
  }
  .key.is-down { transform: translateY(3px); border-bottom-width: 2px; background: #29402f; }
  .action {
    min-height: 42px;
    padding: 0 16px;
    border: 1px solid #596475;
    border-radius: 10px;
    background: #222b39;
    cursor: pointer;
  }
  .status { min-height: 1.5em; margin: 10px 0 0; font-size: .82rem; color: #b9c0ca; }
  .status.good { color: var(--led-on); }
  .status.bad { color: var(--error); }
  .stats { margin-top: 14px; padding-top: 12px; border-top: 1px solid #293141; font-size: .8rem; }
  .stats strong { font-family: "IBM Plex Mono", monospace; color: var(--silk); }
  .convert-input {
    width: 100%; min-height: 86px; resize: vertical; padding: 10px 12px;
    border: 1px solid #596475; border-radius: 10px; background: #0b1018;
    color: var(--silk); line-height: 1.6;
  }
  .convert-preview, .convert-output {
    min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap;
    font-family: "IBM Plex Mono", monospace; line-height: 1.7;
  }
  .convert-preview { min-height: 1.7em; margin: 6px 0 10px; color: #aeb6c1; }
  .convert-output { min-height: 1.7em; margin: 2px 0 10px; color: var(--led-on); }
  .convert-roman { margin: 2px 0 8px; overflow-wrap: anywhere; color: var(--silk); font-family: "IBM Plex Mono", monospace; }
  .convert-error { color: var(--error); text-decoration: underline; text-decoration-thickness: 2px; }
  .convert-active { color: #0A0D13; background: var(--led-on); border-radius: 3px; }
  .convert-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .convert-actions .action { flex: 0 1 auto; }
  .notation-toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 42px; font-size: .78rem; }
  .notation-toggle input { width: 19px; height: 19px; accent-color: var(--led-on); }
  details {
    margin-top: 10px;
    border: 1px solid #293141;
    border-radius: 14px;
    background: #0e141e;
  }
  summary { padding: 13px 15px; font-weight: 700; cursor: pointer; }
  .settings { display: grid; gap: 14px; padding: 3px 15px 16px; }
  .setting-line { display: grid; grid-template-columns: 92px 1fr 54px; align-items: center; gap: 10px; font-size: .78rem; }
  .setting-line output { text-align: right; font-family: "IBM Plex Mono", monospace; color: var(--led-on); }
  input[type="range"] { width: 100%; min-width: 0; accent-color: var(--led-on); }
  .switch-line { display: flex; justify-content: space-between; align-items: center; font-size: .78rem; }
  .switch-line input { width: 20px; height: 20px; accent-color: var(--led-on); }
  .light-status { min-height: 1.5em; margin: -8px 0 0; color: #aeb6c1; font-size: .72rem; line-height: 1.5; }
  #screen-flash {
    position: fixed; inset: 0; z-index: 9999; display: none;
    background: transparent; pointer-events: none;
  }
  #screen-flash.running { display: block; }
  #screen-flash.on { background: #fff; }
  #screen-flash-stop {
    position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px;
    z-index: 10000; display: none; min-width: 56px; padding: 7px 11px;
    border: 1px solid #fff; border-radius: 999px; background: #9f2020;
    color: #fff; font-weight: 700; line-height: 1; pointer-events: auto;
    touch-action: manipulation;
  }
  #screen-flash.running + #screen-flash-stop { display: block; }
  #fatal-error {
    position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 99999;
    max-height: 30vh; overflow: auto; padding: 10px 42px 10px 12px;
    border-radius: 10px; background: #3a0d0d; color: #ffd6d6;
    font: 12px/1.5 monospace; white-space: pre-wrap; word-break: break-all;
    pointer-events: none;
  }
  #fatal-error-close {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px;
    padding: 0; border: 1px solid #ffd6d6; border-radius: 50%;
    background: #641717; color: #fff; pointer-events: auto; cursor: pointer;
  }
  @media (max-width: 360px) {
    .app { padding-inline: 7px; }
    .panel { padding: 13px; }
    .tagline { display: none; }
  }
  @media (max-width: 430px) {
    .app-header { gap: 8px; }
    h1 { font-size: clamp(1.35rem, 6.2vw, 1.6rem); }
    .tagline { font-size: .65rem; }
  }
  @media (max-width: 420px) and (max-height: 700px) {
    .app { padding-top: 8px; padding-bottom: 12px; }
    .app-header { margin-bottom: 6px; }
    .tabs { margin-top: 8px; padding: 4px; }
    .tab { min-height: 38px; }
    .panel { min-height: 145px; margin-top: 6px; padding: 10px 12px; }
    .readout { min-height: 40px; }
    .key { min-height: 58px; margin-top: 6px; }
    .instruction { line-height: 1.4; }
    .status { margin-top: 6px; }
    .convert-actions .action { flex: 1 1 82px; padding-inline: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

<div id="fatal-error" role="alert" hidden><button id="fatal-error-close" type="button" aria-label="エラー表示を閉じる">×</button><span id="fatal-error-message"></span></div>

<main class="app">
  <header class="app-header">
    <h1>MORSE TAG</h1>
    <p class="tagline">光でたどる、音で覚える</p>
  </header>

  <div class="plate-wrap">
    <svg id="plate" viewBox="0 0 520 760" role="img" aria-labelledby="plate-name plate-desc">
      <title id="plate-name">モールス符号の二分木プレート</title>
      <desc id="plate-desc">左に長音で始まる文字、右に短点で始まる文字を配置した練習用プレート</desc>
      <rect class="plate-edge" x="6" y="6" width="508" height="748" rx="34"/>
      <rect class="plate-inner" x="14" y="14" width="492" height="732" rx="27"/>
      <circle class="hanger-rim" cx="469" cy="52" r="23"/><circle class="hanger-hole" cx="469" cy="52" r="11"/>
      <text class="plate-title" x="42" y="58">MORSE</text>
      <text class="plate-subtitle" x="414" y="78" text-anchor="end">CODE</text>
      <g aria-hidden="true">
        <path class="antenna" d="M260 146V111M246 124a20 20 0 0 1 28 0M236 114a34 34 0 0 1 48 0"/>
        <circle cx="260" cy="146" r="4" fill="#D8DDE5"/>
      </g>
      <g id="branches" aria-hidden="true"></g>
      <g id="nodes"></g>
    </svg>
  </div>

  <nav class="tabs" role="tablist" aria-label="練習モード">
    <button class="tab" id="tab-explore" role="tab" aria-selected="true" aria-controls="panel-explore" data-mode="explore">さわる</button>
    <button class="tab" id="tab-key" role="tab" aria-selected="false" aria-controls="panel-key" data-mode="key">打つ</button>
    <button class="tab" id="tab-quiz" role="tab" aria-selected="false" aria-controls="panel-quiz" data-mode="quiz">聞く</button>
    <button class="tab" id="tab-convert" role="tab" aria-selected="false" aria-controls="panel-convert" data-mode="convert">変換</button>
  </nav>

  <section class="panel" id="panel-explore" role="tabpanel" aria-labelledby="tab-explore">
    <p class="eyebrow">選んだ文字</p>
    <p class="readout"><span class="letter" id="explore-letter">E</span>&nbsp; <span id="explore-code">・</span></p>
    <p class="instruction">プレートの文字を押すと、根から光と音が順番にたどります。</p>
    <p class="status" id="explore-status" aria-live="polite"></p>
  </section>

  <section class="panel" id="panel-key" role="tabpanel" aria-labelledby="tab-key" hidden>
    <div class="prompt-row">
      <div><p class="eyebrow">お題</p><div class="prompt-letter" id="key-prompt">A</div></div>
      <div><p class="eyebrow">入力</p><p class="readout" id="key-code">—</p></div>
    </div>
    <button class="key" id="telegraph-key" type="button">長さを変えて押す</button>
    <p class="instruction">短く押すと「・」、長く押すと「－」。スペースキーでも打てます。</p>
    <p class="status" id="key-status" aria-live="polite"></p>
  </section>

  <section class="panel" id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
    <div class="quiz-row">
      <div><p class="eyebrow">音を聞いて文字を選ぶ</p><p class="readout" id="quiz-mark">？？</p></div>
      <button class="action" id="play-quiz" type="button">問題を出す</button>
    </div>
    <p class="status" id="quiz-status" aria-live="polite">「問題を出す」を押してください。</p>
    <div class="stats"><span>正答率 <strong id="accuracy">—</strong></span><span>連続正解 <strong id="streak">0</strong></span></div>
  </section>

  <section class="panel" id="panel-convert" role="tabpanel" aria-labelledby="tab-convert" hidden>
    <label class="eyebrow" for="convert-input">テキスト</label>
    <textarea class="convert-input" id="convert-input" rows="3" maxlength="200">こんにちは</textarea>
    <div class="convert-preview" id="convert-preview" aria-label="入力内容"></div>
    <p class="eyebrow">ローマ字</p>
    <p class="convert-roman" id="convert-roman"></p>
    <p class="eyebrow">モールス</p>
    <div class="convert-output" id="convert-output"></div>
    <div class="convert-actions">
      <button class="action" id="read-kanji" type="button" hidden>漢字を読む（辞書 約6MB・初回は時間がかかります）</button>
      <button class="action" id="play-convert" type="button">再生</button>
      <button class="action" id="stop-convert" type="button" disabled>停止</button>
      <button class="action" id="copy-convert" type="button">コピー</button>
      <label class="notation-toggle"><input id="ascii-notation" type="checkbox">.- 表記</label>
    </div>
    <p class="status" id="convert-status" aria-live="polite"></p>
  </section>

  <details>
    <summary>音と練習の設定</summary>
    <div class="settings">
      <label class="setting-line"><span>速度</span><input id="wpm" type="range" min="5" max="30" value="20"><output id="wpm-out">20 WPM</output></label>
      <label class="setting-line"><span>周波数</span><input id="frequency" type="range" min="400" max="900" step="25" value="600"><output id="frequency-out">600 Hz</output></label>
      <label class="switch-line"><span>音を鳴らす</span><input id="sound-on" type="checkbox" checked></label>
      <label class="switch-line"><span>聞くモードで光を表示</span><input id="quiz-light" type="checkbox" checked></label>
      <label class="switch-line"><span>光で送る</span><input id="signal-light" type="checkbox"></label>
      <p class="light-status" id="light-status" aria-live="polite">オフ</p>
    </div>
  </details>
</main>

<div id="screen-flash" aria-hidden="true"></div>
<button id="screen-flash-stop" type="button">停止</button>

<script>
window.showFatalError = function (error, line) {
  var box = document.getElementById('fatal-error');
  var message = document.getElementById('fatal-error-message');
  if (!box || !message) return;
  var detail = error && (error.stack || error.message) || String(error || '不明なエラー');
  message.textContent = 'エラー（この画面をスクショで送ってください）\n' + detail + '\n行: ' + (line || '?') + '\n' + navigator.userAgent;
  box.hidden = false;
};
document.getElementById('fatal-error-close').addEventListener('click', function () {
  document.getElementById('fatal-error').hidden = true;
});
window.addEventListener('error', function (e) { window.showFatalError(e.error || e.message, e.lineno); });
window.addEventListener('unhandledrejection', function (e) { window.showFatalError(e.reason, 'Promise'); });
</script>

      wakeLock = lock;
      lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
    } catch (_) {}
  }

  function beginSignalPlayback(epoch) {
    if (!document.querySelector('#signal-light').checked || lightMethod === 'off') return;
    lightEpoch = epoch;
    if (lightMethod === 'screen') document.querySelector('#screen-flash').classList.add('running');
    acquireWakeLock(epoch);
  }

  function endSignalPlayback(epoch = null) {
    if (epoch !== null && epoch !== lightEpoch) return;
    lightEpoch++;
    if (lightMethod === 'torch' && lightTrack?.readyState === 'live') {
      lightTrack.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {});
    }
    document.querySelector('#screen-flash').classList.remove('on', 'running');
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }

  function disableSignalLight(message = 'オフ') {
    endSignalPlayback();
    if (lightStream) lightStream.getTracks().forEach(track => track.stop());
    lightStream = null;
    lightTrack = null;
    lightMethod = 'off';
    setLightStatus(message);
  }

  async function audio() {
    if (!document.querySelector('#sound-on').checked) return null;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) throw new Error('AudioContext is not supported');
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === 'suspended') await audioContext.resume();
      return audioContext;
    } catch (error) {
      console.error('AudioContextの開始に失敗しました:', error);
      clearTimersAndLights();
      const status = document.querySelector(`#panel-${mode} .status`) || document.querySelector('#light-status');
      if (status) {
        status.textContent = '音を開始できませんでした（マナーモード・消音を確認）';
        if (status.classList.contains('status')) status.className = 'status bad';
      }
      return null;
    }
  }

  function stopSound(sound) {
    if (!sound || !activeSounds.has(sound)) return;
    const now = sound.ctx.currentTime;
    try {
      sound.gain.gain.cancelScheduledValues(now);
      sound.gain.gain.setValueAtTime(Math.max(sound.gain.gain.value, 0.0001), now);
      sound.gain.gain.exponentialRampToValueAtTime(0.0001, now + .018);
      sound.osc.stop(now + .025);
    } catch (_) {}
    activeSounds.delete(sound);
  }

  function stopAllAudio() {
    for (const sound of [...activeSounds]) stopSound(sound);
    heldSound = null;
  }

  async function tone(startOffset, duration, epoch = audioEpoch) {
    const ctx = await audio();
    if (!ctx || epoch !== audioEpoch) return;
    const start = ctx.currentTime + startOffset / 1000;
    const end = start + duration / 1000;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = Number(document.querySelector('#frequency').value);
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.055, start + Math.min(.012, duration / 5000));
    gain.gain.setValueAtTime(0.055, Math.max(start + .013, end - .018));
    gain.gain.exponentialRampToValueAtTime(0.0001, end);
    osc.connect(gain).connect(ctx.destination);
    const sound = { ctx, osc, gain };
    activeSounds.add(sound);
    osc.onended = () => activeSounds.delete(sound);
    osc.start(start); osc.stop(end + .01);
  }

  async function startHeldTone(epoch) {
    const ctx = await audio();
    if (!ctx || epoch !== audioEpoch || !keyDownAt || mode !== 'key') return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const now = ctx.currentTime;
    osc.frequency.value = Number(document.querySelector('#frequency').value);
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.055, now + .012);
    osc.connect(gain).connect(ctx.destination);
    const sound = { ctx, osc, gain };
    activeSounds.add(sound);
    osc.onended = () => activeSounds.delete(sound);
    osc.start(now);
    heldSound = sound;
  }

  function playPath(letter, showLight = true) {
    clearTimersAndLights();
    const epoch = audioEpoch;
    const code = MORSE[letter];
    const unit = unitMs();
    let cursor = 0;
    beginSignalPlayback(epoch);
    [...code].forEach((mark, i) => {
      const duration = mark === '.' ? unit : unit * 3;
      const stepLetter = reverse[code.slice(0, i + 1)];
      if (showLight) later(() => node(stepLetter)?.classList.add('active'), cursor);
      tone(cursor, duration, epoch);
      scheduleSignal(cursor, duration, epoch);
      cursor += duration;
      if (showLight) later(() => node(stepLetter)?.classList.remove('active'), cursor);
      cursor += unit;
    });
    if (showLight) later(() => node(letter)?.classList.add('active'), cursor);
    later(() => endSignalPlayback(epoch), cursor);
    return cursor;
  }

  function onNodeChoose(letter) {
    if (mode === 'explore') {
      document.querySelector('#explore-letter').textContent = letter;
      document.querySelector('#explore-code').textContent = displayCode(MORSE[letter]);
      playPath(letter, true);
    } else if (mode === 'quiz' && quizTarget) {
      clearTimersAndLights();
      const correct = letter === quizTarget;
      quizTotal++;
      if (correct) { quizCorrect++; streak++; progress[quizTarget].correct++; }
      else { streak = 0; progress[quizTarget].wrong++; flashError(letter); }
      saveProgress();
      document.querySelector('#quiz-status').textContent = correct ? `正解。${quizTarget} は ${displayCode(MORSE[quizTarget])}` : `違います。正解は ${quizTarget}（${displayCode(MORSE[quizTarget])}）`;
      document.querySelector('#quiz-status').className = `status ${correct ? 'good' : 'bad'}`;
      document.querySelector('#quiz-mark').textContent = displayCode(MORSE[quizTarget]);
      document.querySelector('#accuracy').textContent = `${Math.round(quizCorrect / quizTotal * 100)}%`;
      document.querySelector('#streak').textContent = streak;
      node(quizTarget)?.classList.add('active');
      quizTarget = null;
      document.querySelector('#play-quiz').textContent = '次の問題';
    }
  }

  function flashError(letter) {
    const el = node(letter);
    if (!el) return;
    el.classList.add('error');
    later(() => el.classList.remove('error'), 430);
  }

  function saveProgress() {
    try { localStorage.setItem('morse-tag-progress', JSON.stringify(progress)); } catch (_) {}
  }

  function chooseWeightedQuestion() {
    const bag = [];
    for (const letter of Object.keys(MORSE)) {
      const score = progress[letter];
      const weight = Math.max(1, 2 + score.wrong * 3 - score.correct);
      for (let i = 0; i < Math.min(weight, 12); i++) bag.push(letter);
    }
    return bag[Math.floor(Math.random() * bag.length)];
  }

  function beginKey() {
    if (keyDownAt || keyFinalizing) return;
    keyDownAt = performance.now();
    document.querySelector('#telegraph-key').classList.add('is-down');
    document.querySelector('#telegraph-key').setAttribute('aria-pressed', 'true');
    if (keyFinalizeTimer) clearTimeout(keyFinalizeTimer);
    keyFinalizeTimer = 0;
    startHeldTone(audioEpoch);
  }

  function endKey() {
    if (!keyDownAt) return;
    const held = performance.now() - keyDownAt;
    keyDownAt = 0;
    const unit = unitMs();
    const mark = held >= Math.max(unit * 2, 150) ? '-' : '.';
    document.querySelector('#telegraph-key').classList.remove('is-down');
    document.querySelector('#telegraph-key').setAttribute('aria-pressed', 'false');
    stopSound(heldSound);
    heldSound = null;
    keySequence += mark;
    document.querySelector('#key-code').textContent = displayCode(keySequence);
    clearTimersAndLights();
    const current = reverse[keySequence];
    const isPrefix = Object.values(MORSE).some(code => code.startsWith(keySequence));
    if (!isPrefix) {
      document.querySelector('#key-status').textContent = 'その経路はありません。もう一度どうぞ。';
      document.querySelector('#key-status').className = 'status bad';
      for (const el of document.querySelectorAll('.morse-node')) el.classList.add('error');
      later(resetKeySequence, 500);
      return;
    }
    if (current) node(current)?.classList.add('active');
    keyFinalizeTimer = setTimeout(finalizeKey, Math.max(unit * 5, 700));
  }

  function cancelKeyPress() {
    keyDownAt = 0;
    document.querySelector('#telegraph-key').classList.remove('is-down');
    document.querySelector('#telegraph-key').setAttribute('aria-pressed', 'false');
    stopSound(heldSound);
    heldSound = null;
  }

  function resetKeySequence() {
    keySequence = '';
    document.querySelector('#key-code').textContent = '—';
    document.querySelectorAll('.morse-node').forEach(el => el.classList.remove('active', 'error'));
  }

  function finalizeKey() {
    const sequence = keySequence;
    keySequence = '';
    keyFinalizeTimer = 0;
    keyFinalizing = true;
    const answer = reverse[sequence];
    const correct = answer === keyPrompt;
    if (answer) {
      progress[keyPrompt][correct ? 'correct' : 'wrong']++;
      saveProgress();
      document.querySelector('#key-status').textContent = correct ? `正解。${answer} です。` : `${answer} でした。お題は ${keyPrompt} です。`;
      document.querySelector('#key-status').className = `status ${correct ? 'good' : 'bad'}`;
      if (!correct) flashError(answer);
    }
    keyNextTimer = setTimeout(() => {
      keyNextTimer = 0;
      keyFinalizing = false;
      keyPrompt = randomLetter();
      document.querySelector('#key-prompt').textContent = keyPrompt;
      resetKeySequence();
    }, 900);
  }

  function switchMode(next) {
    mode = next;
    clearTimersAndLights();
    if (keyFinalizeTimer) clearTimeout(keyFinalizeTimer);
    if (keyNextTimer) clearTimeout(keyNextTimer);
    keyFinalizeTimer = 0;
    keyNextTimer = 0;
    keyFinalizing = false;
    keySequence = '';
    cancelKeyPress();
    resetKeySequence();
    document.querySelectorAll('.tab').forEach(tab => {
      const selected = tab.dataset.mode === next;
      tab.setAttribute('aria-selected', String(selected));
      tab.tabIndex = selected ? 0 : -1;
    });
    document.querySelectorAll('.panel').forEach(panel => panel.hidden = panel.id !== `panel-${next}`);
    if (next === 'explore') node(document.querySelector('#explore-letter').textContent)?.classList.add('active');
    if (next === 'key') document.querySelector('#telegraph-key').focus();
  }

  function reportStartupError(part, error) {
    console.error(`${part}に失敗しました:`, error);
    window.showFatalError(error, part);
  }

  function registerEvents() {
    nodesLayer.addEventListener('click', event => {
    const target = event.target.closest('.morse-node');
    if (target) onNodeChoose(target.dataset.letter);
    });
    nodesLayer.addEventListener('keydown', event => {
    const target = event.target.closest('.morse-node');
    if (target && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); onNodeChoose(target.dataset.letter); }
    });
    document.querySelector('.tabs').addEventListener('click', event => {
    const tab = event.target.closest('.tab');
    if (tab) switchMode(tab.dataset.mode);
    });
    document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('keydown', event => {
    if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
    const tabs = [...document.querySelectorAll('.tab')];
    const delta = event.key === 'ArrowRight' ? 1 : -1;
    const next = tabs[(tabs.indexOf(tab) + delta + tabs.length) % tabs.length];
    switchMode(next.dataset.mode); next.focus();
    }));

    const keyButton = document.querySelector('#telegraph-key');
    if (window.PointerEvent) {
      keyButton.addEventListener('pointerdown', event => {
        event.preventDefault();
        beginKey();
        try { keyButton.setPointerCapture(event.pointerId); } catch (error) { console.error('pointer captureに失敗しました:', error); }
      });
      keyButton.addEventListener('pointerup', endKey);
      keyButton.addEventListener('pointercancel', cancelKeyPress);
    } else {
      keyButton.addEventListener('touchstart', event => { event.preventDefault(); beginKey(); }, { passive: false });
      keyButton.addEventListener('touchend', event => { event.preventDefault(); endKey(); }, { passive: false });
      keyButton.addEventListener('touchcancel', cancelKeyPress);
      keyButton.addEventListener('mousedown', event => { event.preventDefault(); beginKey(); });
      window.addEventListener('mouseup', endKey);
    }
    window.addEventListener('keydown', event => {
    if (mode === 'key' && event.code === 'Space' && !['INPUT','SELECT'].includes(document.activeElement.tagName)) {
      event.preventDefault();
      if (!event.repeat) beginKey();
    }
    });
    window.addEventListener('keyup', event => {
    if (mode === 'key' && event.code === 'Space' && !['INPUT','SELECT'].includes(document.activeElement.tagName)) { event.preventDefault(); endKey(); }
    });

    document.querySelector('#play-quiz').addEventListener('click', () => {
    if (!quizTarget) quizTarget = chooseWeightedQuestion();
    document.querySelector('#quiz-mark').textContent = '？？';
    document.querySelector('#quiz-status').textContent = '再生中。文字を選んでください。';
    document.querySelector('#quiz-status').className = 'status';
    document.querySelector('#play-quiz').textContent = 'もう一度聞く';
    playPath(quizTarget, document.querySelector('#quiz-light').checked);
    });
    document.querySelector('#wpm').addEventListener('input', event => document.querySelector('#wpm-out').textContent = `${event.target.value} WPM`);
    document.querySelector('#frequency').addEventListener('input', event => document.querySelector('#frequency-out').textContent = `${event.target.value} Hz`);
    document.querySelector('#signal-light').addEventListener('change', async event => {
    if (event.target.checked) await enableSignalLight();
    else disableSignalLight();
    });
    document.querySelector('#screen-flash-stop').addEventListener('click', () => {
    clearTimersAndLights();
    if (mode === 'convert') document.querySelector('#convert-status').textContent = '停止しました';
    });
    document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    clearTimersAndLights();
    if (document.querySelector('#signal-light').checked) {
      document.querySelector('#signal-light').checked = false;
      disableSignalLight('ページが非表示になったため停止しました');
    }
    });

    document.querySelector('#convert-input').addEventListener('input', scheduleConversion);
    document.querySelector('#read-kanji').addEventListener('click', readKanji);
    document.querySelector('#play-convert').addEventListener('click', playConversion);
    document.querySelector('#stop-convert').addEventListener('click', () => {
    clearTimersAndLights();
    document.querySelector('#convert-status').textContent = '停止しました';
    });
    document.querySelector('#copy-convert').addEventListener('click', copyConversion);
  }

  try { registerEvents(); } catch (error) { reportStartupError('イベント登録', error); }
  try { buildPlate(); } catch (error) { reportStartupError('プレート生成', error); }
  const safeValidate = () => {
    try { validateModel(); } catch (error) { reportStartupError('配置チェック', error); }
  };
  if (location.search.includes('debug') && document.fonts?.ready) document.fonts.ready.then(safeValidate).catch(error => reportStartupError('フォント読み込み後の配置チェック', error));
  try {
    document.querySelector('#key-prompt').textContent = keyPrompt;
    if (mode === 'explore') node('E')?.classList.add('active');
  } catch (error) { reportStartupError('初期表示', error); }
  try {
    renderConversion();
    // 読み込み前はかな例文を描画し、その後に新しい漢字入り初期例文を変換する。
    setTimeout(() => {
      try {
        const input = document.querySelector('#convert-input');
        input.value = 'こんにちは';
        scheduleConversion();
      } catch (error) { reportStartupError('変換初期化', error); }
    }, 0);
  } catch (error) { reportStartupError('変換初期化', error); }

  // 追加仕様に記載された変換の自己テスト。
  console.assert(convertText('こんにちは').roman.toUpperCase() === 'KONNICHIHA', 'こんにちは → KONNICHIHA');
  console.assert(convertText('キャッチ').roman.toUpperCase() === 'KYATCHI', 'キャッチ → KYATCHI');
  console.assert(convertText('ラーメン').roman.toUpperCase() === 'RAAMEN', 'ラーメン → RAAMEN');
  console.assert(morseString(convertText('SOS'), true) === '... --- ...', 'SOS → ... --- ...');
  console.assert(convertText('東京').errors.every(error => error.type === 'kanji') && convertText('東京').errors.length === 2, '東京 → 漢字エラー');
})();
</script>

</body>
</html>
